# The frontend builds independently of the internal Python API and GitHub Pages.
# Do not add a main push trigger: legacy Tencent polling treats this workflow's
# successful push runs as deployment approval. Main CI lives in local-hospital-ci.yml.
name: Tencent frontend tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # Release-specific URLs preserve old assets for browsers open during updates.
      - run: npm run build -- --base=/releases/${{ github.sha }}/
