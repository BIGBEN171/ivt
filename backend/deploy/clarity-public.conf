# Public frontend gateway. Install as /etc/nginx/conf.d/clarity-public.conf.
# Serve only local build artifacts; page requests never contact GitHub Pages.
# Python stays on loopback; the upload endpoint is forwarded over this HTTPS origin.
server {
    # Reserve 443 for automated TLS-ALPN certificate validation, not the API.
    listen 8082 ssl;
    server_name _;
    server_tokens off;
    # These files are created and renewed by the root-only Lego service.
    ssl_certificate /var/lib/clarity-acme/certificates/62.234.95.210.crt;
    ssl_certificate_key /var/lib/clarity-acme/certificates/62.234.95.210.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Upgrade old plain-HTTP bookmarks received on the same dedicated port.
    error_page 497 =301 https://62.234.95.210:8082$request_uri;

    root /var/www/clarity-frontend/current;
    add_header Cache-Control "no-cache" always;
    add_header X-Clarity-Hosting "tencent-local" always;

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /version.json { try_files $uri =404; }

    # Retained release directories keep old asset URLs valid across updates.
    location /releases/ {
        root /var/www/clarity-frontend;
        try_files $uri =404;
    }

    # Receive PNG uploads with multipart overhead. No authentication is configured.
    location = /api/v1/photos {
        client_max_body_size 21m;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Other paths, including photo downloads and API documentation, are not routed.
    location / { return 404; }
}
